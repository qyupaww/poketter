#  prod:
#    project_id: "morpheme_lite"
#    token: "YOUR FIREBASE TOKEN: firebase login:ci"

# Color to Dart code generation configuration
color2dart:
  color2dart_dir: color2dart
  output_dir: lib/core/themes

# Localization configuration
localization:
  arb_dir: assets/l10n
  template_arb_file: id.arb
  output_localization_file: s.dart
  output_class: S
  output_dir: lib/core/l10n
  replace: false

# Asset generation configuration
assets:
  pubspec_dir: .
  output_dir: lib/core/assets
  create_library_file: true
  
# Code coverage configuration
coverage:
  lcov_dir: coverage/lcov.info
  output_html_dir: coverage/html
  remove:
    - "*/mock/*"
    - "*.freezed.*"
    - "*.g.*"
    - "*/l10n/*"
    - "*_state.dart"
    - "*_event.dart"
    - "**/locator.dart"
    - "**/environtment.dart"
    - "lib/core/test/*"
    - "lib/core/constants/*"
    - "lib/core/themes/*"
    - "lib/routes/routes.dart"
    - "lib/generated_plugin_registrant.dart"

