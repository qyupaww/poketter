# Morpheme CLI Lite Configuration
# This file contains all the configuration needed for Morpheme CLI Lite commands
# Learn more: https://github.com/morphemedesign/morpheme-flutter-cli-lite

# Use FVM (Flutter Version Management) for Flutter SDK management
fvm: false

# Flavor configurations for different build environments
flavor:
  dev:
    FLAVOR: dev
    APP_NAME: Poketter
    ANDROID_APPLICATION_ID: poketter.dev
    IOS_APPLICATION_ID: poketter.dev
    BASE_URL: https://pokeapi.co/api/v2
  # stag:
  #   FLAVOR: stag
  #   APP_NAME: Morpheme Lite Stag
  #   ANDROID_APPLICATION_ID: design.morpheme_lite.stag
  #   IOS_APPLICATION_ID: design.morphemeLite.stag
  #   BASE_URL: https://reqres.in/api
  # prod:
  #   FLAVOR: prod
  #   APP_NAME: Morpheme Lite
  #   ANDROID_APPLICATION_ID: design.morpheme_lite
  #   IOS_APPLICATION_ID: design.morphemeLite
  #   BASE_URL: https://reqres.in/api

# Firebase configuration (uncomment and configure when needed)
#firebase:
#  dev:
#    project_id: "morpheme_lite-dev"
