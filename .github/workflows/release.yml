name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build Android (Production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Production)
        run: |
          flutter build apk --release \
            --dart-define=FLAVOR=prod \
            --dart-define=APP_NAME="Poketter" \
            --dart-define=ANDROID_APPLICATION_ID=com.example.poketter \
            --dart-define=BASE_URL=https://pokeapi.co/api/v2

      - name: Build App Bundle (Production)
        run: |
          flutter build appbundle --release \
            --dart-define=FLAVOR=prod \
            --dart-define=APP_NAME="Poketter" \
            --dart-define=ANDROID_APPLICATION_ID=com.example.poketter \
            --dart-define=BASE_URL=https://pokeapi.co/api/v2

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android-release]
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: artifacts/android

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/android/flutter-apk/app-release.apk
            artifacts/android/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
